[workspace]

name = "cevian"
description = "A General Physics Library."
authors = ["KP"]
channels = ["conda-forge"]
version = "0.1.0-dev"
platforms = ["linux-64"]
requires-pixi = ">=0.67.2"

##project running dependencies

[dependencies]
python = "3.12.*"
pip = ">=26.1.1,<27"

##specific dependencies

[feature.build.dependencies]
cmake = ">=3.28.3"
ninja = "*"
nanobind = ">=2.0"
python-build = ">=1.5.0,<2"
scikit-build-core = ">=0.12.1,<0.13"

[feature.tests.dependencies]
pytest = ">=8.0"
hypothesis = ">=6.0"

##  tasks

[feature.build.tasks]
build.cmd = "cmake -S . -B build -G Ninja && cmake --build build"
build.description = "Build C++ extensions"
clean.cmd = "rm -rf build"
clean.description = "Remove build artifacts"

[feature.tests.tasks]
test.cmd = "pytest tests/"
test.description = "Run test suite"

## clang-format

[feature.clang-format.dependencies]
git = "*"
clang-format = "*"

[feature.clang-format.tasks]
format.cmd = "git ls-files '*.cpp' '*.h' | xargs clang-format -i --style=file"
format.description = "Format tracked C++ source and header files in place."
check-formatting.cmd = "git ls-files '*.cpp' '*.h' | xargs clang-format --style=file --Werror --dry-run"
check-formatting.description = "Check C++ formatting and fail if any file needs changes."

[environments]
default = { features = ["build", "tests"], solve-group = "default" }
lint = { features = ["clang-format"], solve-group = "default" }
